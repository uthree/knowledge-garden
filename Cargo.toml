[package]
name = "knowledge-garden"
version = "0.1.0"
edition = "2024"

# The desktop app (`desktop/`) shares this workspace so `cargo run -p desktop` works from here.
# `cargo run`, `cargo build` and `cargo test` without `-p` stay on the server, so the server's
# builds and Docker image do not compile gpui.
[workspace]
members = [".", "desktop"]
default-members = ["."]

[dependencies]
ammonia = "4.2.4"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
http-body-util = "0.1.5"
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros", "regexp"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.1", features = ["v7", "serde"] }

[dev-dependencies]
async-trait = "0.1.92"

# Debug builds optimise the dependencies: password hashing is deliberately slow, and gpui's
# rendering is unusable unoptimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
