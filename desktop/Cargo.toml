[package]
name = "knowledge-garden-desktop"
description = "Knowledge Garden desktop app (gpui + Atelier)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false

# The desktop app is its own workspace with its own Cargo.lock, so the server's
# lockfile and Docker image do not carry gpui.
[workspace]

[[bin]]
name = "knowledge-garden-desktop"
path = "src/main.rs"

[dependencies]
# Pinned to a commit of Atelier's main branch: `TextInput` is not in a release yet.
atelier = { git = "https://github.com/uthree/design-language", rev = "bb373ecf175cb68ae0b0e1c89e01cf5887ca152f", features = ["agents", "runtime-shaders"] }
gpui = "=0.2.2"
knowledge-garden = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
semver = "1"
sha2 = "0.11"
hex = "0.4"
futures = "0.3"
unicode-segmentation = "1.10"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
