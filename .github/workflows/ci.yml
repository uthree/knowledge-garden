name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The desktop app (desktop/) is its own workspace with its own lockfile.
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      # Atelier's check for workarounds and copies of its components, at the revision we build on.
      - if: runner.os == 'Linux'
        run: |
          rev=$(grep -o 'rev = "[0-9a-f]*"' Cargo.toml | head -1 | cut -d'"' -f2)
          curl -fsSL "https://raw.githubusercontent.com/uthree/design-language/$rev/skills/atelier-gpui/tools/check-adoption.sh" -o "$RUNNER_TEMP/check-adoption.sh"
          bash "$RUNNER_TEMP/check-adoption.sh" --strict src
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
